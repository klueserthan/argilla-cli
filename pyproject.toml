[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argilla-cli"
version = "0.2.0"
description = "A production-quality CLI for Argilla"
authors = [{name = "Jonathan Klueser", email = "jonathan.klueser@live.de"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "argilla>=2.8",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "rich>=13",
  "pydantic>=2",
  "pydantic-settings>=2",
  "requests>=2",
  "jmespath>=1.0",
  "PyYAML>=6",
  "tomli-w>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/klueserthan/argilla-cli"
Repository = "https://github.com/klueserthan/argilla-cli"
Issues = "https://github.com/klueserthan/argilla-cli/issues"

[project.scripts]
argilla-cli = "argilla_cli.main:run"

[project.optional-dependencies]
hub = [
  "huggingface_hub>=0.24",
  "Jinja2>=3.1",
  "datasets>=2.19",
]

export = [
  "pandas>=2",
  "pyarrow>=14",
]

# Dev tooling lives in a PEP 735 dependency group: `uv sync` installs it by
# default and it never ships in the published package.
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-jmespath",
  "types-PyYAML",
  "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["argilla.*", "jmespath.*", "pandas.*", "datasets.*", "huggingface_hub.*"]
ignore_missing_imports = true
